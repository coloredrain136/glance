<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Glance</title>
<meta name="theme-color" content="#0e1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
/* ---------- Design tokens (set once, used everywhere) ---------- */
:root{
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r:22px; --r-sm:calc(var(--r)*.62); --r-xs:calc(var(--r)*.4);
  --blur:16px; --glass-a:.62;
  --accent:#5b8cff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --fast:180ms; --med:320ms;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --dock:calc(52px + var(--safe-b)); /* where the top of the dock sits, measured from the bottom */
}
html[data-mode="light"]{
  --bg:#eef1f8; --ink:#131722; --ink-2:rgba(19,23,34,.64); --ink-3:rgba(19,23,34,.4);
  --glass:rgba(255,255,255,var(--glass-a)); --card:rgba(255,255,255,.66);
  --stroke:rgba(255,255,255,.85); --hair:rgba(19,23,34,.09);
  --shadow:0 1px 1px rgba(30,40,80,.05),0 10px 28px -12px rgba(30,40,80,.22);
  --tint:13%; --tint-hi:24%; --wall-a:34%; --wall-b:22%;
}
html[data-mode="dark"]{
  --bg:#0e1220; --ink:#f2f4fa; --ink-2:rgba(242,244,250,.66); --ink-3:rgba(242,244,250,.4);
  --glass:rgba(34,40,62,var(--glass-a)); --card:rgba(255,255,255,.055);
  --stroke:rgba(255,255,255,.11); --hair:rgba(255,255,255,.09);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -14px rgba(0,0,0,.6);
  --tint:17%; --tint-hi:32%; --wall-a:30%; --wall-b:20%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
/* Wallpaper: a still, smooth wash of the accent so the glass has something to sit on */
/* One root box holds everything. It sits in the normal page flow (not position:fixed) and is sized in
   viewport units, because iPhone home-screen apps lay out fixed and percentage heights against a
   viewport that stops short of the bottom of the screen. See fitH in the script. */
#root{position:relative;isolation:isolate;height:100vh;height:var(--app-h,100dvh);overflow:hidden;background:var(--bg)}
/* Wallpaper glow. It starts below the status bar and is gone well before the bottom edge. */
#root::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(95% 44% at 100% 8%,color-mix(in srgb,var(--accent) var(--wall-a),transparent),transparent 72%),
  radial-gradient(70% 32% at 0% 6%,color-mix(in srgb,var(--accent) var(--wall-b),transparent),transparent 70%);
  -webkit-mask-image:linear-gradient(to bottom,transparent var(--safe-t),#000 calc(var(--safe-t) + 110px));
  mask-image:linear-gradient(to bottom,transparent var(--safe-t),#000 calc(var(--safe-t) + 110px))}
/* A solid strip behind the status bar. Since iOS 26, a home-screen app with nothing solid up here
   gets a system blur over the top of the page, which smeared the title. */
#cap{position:fixed;top:0;left:0;right:0;height:var(--safe-t);background-color:var(--bg);z-index:60;pointer-events:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Scrolling content fades out at the top and bottom instead of being cut off with a hard edge */
.fadeY{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - var(--dock) - 30px),transparent calc(100% - var(--dock) - 4px));
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - var(--dock) - 30px),transparent calc(100% - var(--dock) - 4px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);
  border:1px solid var(--stroke);box-shadow:var(--shadow)}

#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ---------- Top: just the title. Controls live in the dock at the bottom. ---------- */
.top{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-4) 0;min-height:44px}
#titleBtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-right:auto;border-radius:var(--r-xs)}
#titleBtn h1{font:700 28px/1.1 var(--display);letter-spacing:-.02em;margin:0;white-space:nowrap}
#titleBtn h1 small{font:500 15px var(--font);color:var(--ink-3);margin-left:6px;letter-spacing:0}
#titleBtn svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-top:3px}
#titleBtn:active{opacity:.6}
.pill{height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:transform var(--fast) var(--ease),opacity var(--fast)}
.pill:active{transform:scale(.94)}
.pill.icon{width:40px;padding:0}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:none}
@media (hover:hover){.nav{display:inline-flex}}

/* ---------- Dock: thumb-reach controls ---------- */
.dock{position:absolute;left:0;right:0;bottom:max(12px,calc(var(--safe-b) - 8px));z-index:5;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 var(--sp-4);pointer-events:none}
.dock>*{pointer-events:auto;--blur:24px;--glass-a:.86}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px}
.tab{width:78px;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);
  transition:background var(--fast),color var(--fast),transform var(--fast) var(--ease)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab:active{transform:scale(.93)}
.tab.on{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--ink)}
.tab.on svg{stroke:var(--accent)}
#todayBtn{width:60px;height:60px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  transition:transform var(--fast) var(--ease),opacity var(--med)}
#todayBtn small{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
#todayBtn b{font:700 23px/1.05 var(--display)}
#todayBtn:active{transform:scale(.92)}
#todayBtn.off{opacity:.45}
#spin{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity var(--med)}
#spin.on{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.5);opacity:.4}}

/* ---------- Week strip ---------- */
.strip{position:relative;margin:var(--sp-2) var(--sp-4) 0;border-radius:var(--r);padding:6px;touch-action:pan-y;overflow:hidden}
.days{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.ind{position:absolute;top:0;bottom:0;left:0;width:calc(100%/7);border-radius:var(--r-sm);background:var(--accent);
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform var(--med) var(--ease)}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:var(--r-sm);transition:color var(--fast)}
.day .wd{font-size:12px;font-weight:600;color:var(--ink-3);transition:color var(--fast)}
.day .num{font:600 20px/1.15 var(--display)}
.day.today .num{color:var(--accent)}
.day.sel{color:#fff}.day.sel .wd{color:rgba(255,255,255,.78)}.day.sel .num{color:#fff}
.marks{display:flex;gap:2px;height:4px;align-items:center;justify-content:center}
.marks i{width:9px;height:4px;border-radius:2px;background:var(--c)}
.day.sel .marks i{box-shadow:0 0 0 1px rgba(255,255,255,.95)}
.days.slide-l{animation:sl var(--med) var(--ease)}.days.slide-r{animation:sr var(--med) var(--ease)}
@keyframes sl{from{transform:translateX(36px);opacity:0}}
@keyframes sr{from{transform:translateX(-36px);opacity:0}}

/* ---------- Week (all 7 days on one screen) ---------- */
#overView{flex:1;min-height:0;display:flex;flex-direction:column}
#weekScroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;
  padding:12px var(--sp-4) calc(var(--dock) + 30px)}
#weekBody{min-height:100%;display:flex;flex-direction:column;gap:5px}
#weekBody.slide-l{animation:sl var(--med) var(--ease)}#weekBody.slide-r{animation:sr var(--med) var(--ease)}#weekBody.fade{animation:fd var(--med) var(--ease)}
/* One soft glass row per day. Events are tinted cards, the same as the Day screen. */
.wrow{flex:1 0 auto;display:flex;align-items:stretch;gap:var(--sp-2);padding:6px 6px 6px 0;border-radius:min(var(--r),20px);
  background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow);cursor:pointer;transition:transform var(--fast) var(--ease)}
.wrow.today{background:color-mix(in srgb,var(--accent) 15%,var(--card));border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.wrow.past{opacity:.5;box-shadow:none}
/* Day rail: date and weekday on one line, free time under it, all on one left edge */
.wl{width:84px;flex:none;display:grid;grid-template-columns:auto 1fr;align-items:center;align-content:center;column-gap:6px;row-gap:4px;padding-left:12px}
.wl .wd{order:2;font-size:13px;font-weight:600;color:var(--ink-3)}
.wl .num{order:1;font:700 22px/1 var(--display);height:28px;display:grid;place-items:center;border-radius:14px}
.wrow.today .num{background:var(--accent);color:#fff;min-width:28px;padding:0 7px;margin-left:-7px}
.wrow.today .wd{color:var(--accent)}
.wl .fr{order:3;grid-column:1/-1;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.wl .fr em{font-style:normal;font-weight:500;color:var(--ink-3)}
.wr{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:center;gap:5px}
.ev{flex:1 1 calc(50% - 3px);min-width:118px;text-align:left;position:relative;padding:5px 9px 5px 15px;border-radius:min(var(--r-sm),13px);
  background:color-mix(in srgb,var(--c) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.ev::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3.5px;border-radius:4px;background:var(--c)}
.ev .t{display:block;font-weight:600;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.ev .w{display:block;font-size:12.5px;line-height:1.25;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev:active{transform:scale(.97)}
.ev.past{opacity:.5}
.ev.next{background:color-mix(in srgb,var(--c) var(--tint-hi),var(--card));border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.chips{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:5px}
.ev.ad{flex:0 1 auto;min-width:0;padding:3px 11px 3px 22px;border-radius:999px}
/* A day note (payday, say): a hollow marker, lighter than a real event */
.ev.note{background:transparent;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.ev.note::before{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.ev.ad::before{top:50%;bottom:auto;left:9px;width:7px;height:7px;margin-top:-3.5px;border-radius:50%}
.ev.ad .t{font-size:12.5px}
.wgap{display:none}
.none{flex:1;align-self:center;padding:9px 12px;border-radius:min(var(--r-sm),14px);border:1.5px dashed var(--hair);color:var(--ink-3);font-size:13.5px;font-weight:600}

/* Mac / PC: the week becomes seven columns side by side */
@media (min-width:900px){
  #app{max-width:1280px}
  #weekView,#monthView{width:100%;max-width:560px;margin:0 auto}
  .dock{justify-content:flex-end;padding-right:var(--sp-5)}
  .top{padding-top:var(--sp-5)}
  #weekBody{flex-direction:row;gap:10px}
  .wrow{flex:1 1 0;min-width:0;flex-direction:column;gap:var(--sp-3);padding:var(--sp-3) 10px}
  .wr{gap:6px}
  .wl .num{min-width:34px;height:34px}
  .wl{display:flex;width:auto;flex-direction:row;justify-content:flex-start;align-items:center;gap:6px;padding-left:4px}
  .wrow.today .num{margin-left:0}
  .wl .fr{margin-left:auto;font-size:11.5px}
  .wr{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-content:stretch}
  .ev{flex:none;min-width:0;padding:10px 10px 10px 16px}
  .ev .t{font-size:15px}.ev .w{font-size:13px;margin-top:3px}
  .ev.ad{padding:5px 10px 5px 22px}
  .chips{flex:none}
  .wgap{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 7px;min-height:var(--h);font-size:12.5px;color:var(--ink-3)}
  .wgap::before{content:"";align-self:stretch;width:2px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--ink-3) 0 3px,transparent 3px 8px);opacity:.6}
  .wgap.now{color:var(--accent);font-weight:600}
  .wgap.past{opacity:.45}
  .none{flex:none;align-self:stretch;text-align:center;padding:18px 8px}
}

/* ---------- Day ---------- */
#weekView,#monthView{flex:1;min-height:0;display:flex;flex-direction:column}
#dayScroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;
  padding:var(--sp-5) var(--sp-4) calc(var(--dock) + 34px)}
#dayBody.slide-l{animation:sl var(--med) var(--ease)}#dayBody.slide-r{animation:sr var(--med) var(--ease)}
#dayBody.fade{animation:fd var(--med) var(--ease)}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.dayhead h2{font:700 34px/1.02 var(--display);letter-spacing:-.025em;margin:0}
.dayhead .date{color:var(--ink-2);font-size:15px;margin-top:4px}
.verdict{text-align:right;font-size:14px;color:var(--ink-2);line-height:1.3;white-space:nowrap}
.verdict b{display:block;font:600 17px var(--display);color:var(--ink)}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;
  background:color-mix(in srgb,var(--c) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,var(--stroke))}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.note{background:transparent;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.chip.note i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}

.card{display:block;width:100%;text-align:left;position:relative;padding:14px var(--sp-4) 14px 22px;border-radius:var(--r);
  background:color-mix(in srgb,var(--c) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--c) 16%,var(--stroke));
  box-shadow:var(--shadow);transition:transform var(--fast) var(--ease),opacity var(--med)}
.card:active{transform:scale(.98)}
.card::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c)}
.card .t{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.card .w{display:flex;justify-content:space-between;gap:var(--sp-3);margin-top:4px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.card .loc{margin-top:2px;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.card.past{opacity:.5;box-shadow:none}
.card.next{background:color-mix(in srgb,var(--c) var(--tint-hi),var(--card));border-color:color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:var(--shadow),0 10px 30px -12px color-mix(in srgb,var(--c) 70%,transparent)}
.tag{display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}

/* Free time is space, not a card */
.free{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-2) 0 9px;min-height:44px;height:var(--h);color:var(--ink-3);font-size:14px}
.free::before{content:"";align-self:stretch;margin:8px 0;width:2px;border-radius:2px;
  background:repeating-linear-gradient(to bottom,var(--ink-3) 0 3px,transparent 3px 9px);opacity:.7}
.free b{font:600 15px var(--display);color:var(--ink-2);margin-right:6px}
.free span{font-variant-numeric:tabular-nums}
.free .d{margin-left:auto}
.free.now b{color:var(--accent)}
.free.past{opacity:.45}
.open{margin-top:var(--sp-5);padding:var(--sp-6) var(--sp-4);text-align:center;border-radius:var(--r);border:1.5px dashed var(--hair);color:var(--ink-2)}
.open b{display:block;font:700 22px var(--display);color:var(--ink);margin-bottom:4px}
.stack>*{margin-top:var(--sp-2)}.stack>*:first-child{margin-top:0}
.notice{margin-bottom:var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);font-size:14px;line-height:1.4;
  background:color-mix(in srgb,#ff453a 14%,var(--card));border:1px solid color-mix(in srgb,#ff453a 40%,transparent);-webkit-user-select:text;user-select:text}

/* ---------- Month: compact grid on top, the picked day's events underneath ---------- */
#monthView{padding:var(--sp-2) 0 0;touch-action:pan-y}
.mwrap{margin:0 var(--sp-4);border-radius:var(--r);padding:var(--sp-3) var(--sp-2) var(--sp-2);flex:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding-bottom:var(--sp-2)}
.dow .we{color:color-mix(in srgb,var(--accent) 75%,var(--ink-3))}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid.slide-l{animation:sl var(--med) var(--ease)}.grid.slide-r{animation:sr var(--med) var(--ease)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:50px;border-radius:min(var(--r-sm),14px);border:1px solid transparent;
  transition:background var(--fast),border-color var(--fast),transform var(--fast) var(--ease)}
.cell .num{font:600 17px/1 var(--display)}
.cell .marks i{width:7px}
.cell{position:relative}
.cell .nd{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c)}
.cell.sel .nd{box-shadow:inset 0 0 0 1.5px #fff}
.cell.busy{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cell.out{opacity:.3}
.cell.gone .num{color:var(--ink-3)}
.cell.gone .marks{opacity:.45}
.cell.today{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.cell.today .num{color:var(--accent)}
.cell.sel{background:var(--accent);border-color:transparent;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 85%,transparent)}
.cell.sel .num{color:#fff}
.cell.sel .marks i{background:#fff;opacity:.9}
.cell:active{transform:scale(.92)}
#agenda{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding:var(--sp-5) var(--sp-4) calc(var(--dock) + 34px)}
#agendaBody.fade{animation:fd var(--med) var(--ease)}
.ahead{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.ahead h2{font:700 22px/1.1 var(--display);letter-spacing:-.015em;margin:0}
.ahead .sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.ahead .pill{margin-left:auto;color:var(--accent);flex:none}
#agenda .wr{align-content:flex-start;gap:var(--sp-2)}
#agenda .ev:not(.ad){padding:9px 10px 9px 16px}

/* ---------- Jump to month / year ---------- */
.yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)}
.yr b{font:700 30px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.yr button{width:52px;height:52px;border-radius:50%;background:var(--hair);display:grid;place-items:center}
.yr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.mos button{height:54px;border-radius:var(--r-sm);background:var(--hair);font-weight:600;font-size:16px;transition:transform var(--fast) var(--ease)}
.mos button:active{transform:scale(.95)}
.mos .now{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.mos .on{background:var(--accent);color:#fff;box-shadow:none}
.jump{width:100%;height:50px;margin-top:var(--sp-3);border-radius:var(--r-sm);font-weight:700;color:var(--accent)}

/* ---------- Sheets ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(5,8,18,.42);opacity:0;pointer-events:none;transition:opacity var(--med)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;
  padding:var(--sp-2) var(--sp-5) calc(var(--sp-5) + var(--safe-b));max-height:86%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(105%);transition:transform var(--med) var(--ease);--blur:28px;-webkit-user-select:text;user-select:text}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:5px;background:var(--ink-3);opacity:.5;margin:4px auto var(--sp-4)}
.sheet h3{font:700 24px/1.2 var(--display);letter-spacing:-.01em;margin:var(--sp-2) 0 var(--sp-4);overflow-wrap:anywhere}
.row{display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--hair);font-size:16px}
.row .k{width:76px;flex:none;color:var(--ink-3);font-size:14px;padding-top:1px}
.row .v{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.row .v small{display:block;color:var(--ink-2);font-size:14px}

#settings{top:0;max-height:none;border-radius:0;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;padding-top:calc(var(--safe-t) + var(--sp-3));-webkit-user-select:none;user-select:none}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)}
.shead h2{font:700 28px var(--display);letter-spacing:-.02em;margin:0}
.shead .pill{color:var(--accent)}
.sec{margin-top:var(--sp-5)}
.sec>h4{margin:0 0 var(--sp-2) var(--sp-1);font-size:14px;font-weight:600;color:var(--ink-2)}
.box{border-radius:var(--r);background:var(--card);border:1px solid var(--stroke);overflow:hidden}
.line{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);min-height:52px;border-top:1px solid var(--hair)}
.line:first-child{border-top:0}
.line>span:first-child{flex:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--hair)}
.seg button{padding:6px 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background var(--fast),color var(--fast)}
.seg button.on{background:var(--accent);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:3px 3px 3px 0}
.win{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}.win select{padding:8px 6px;font-size:15px}
.sw button,.sw label{width:30px;height:30px;border-radius:50%;background:var(--c);position:relative;overflow:hidden;cursor:pointer}
.sw .on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.sw label{background:conic-gradient(#ff453a,#ff9f0a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a)}
.sw label input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
input[type=range]{flex:1;max-width:190px;accent-color:var(--accent)}
select,input[type=text],input[type=password]{font:inherit;color:var(--ink);background:var(--hair);border:0;border-radius:var(--r-xs);padding:8px 10px;min-width:0}
.type{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--hair)}
.type:first-child{border-top:0}
.type .a{display:flex;align-items:center;gap:var(--sp-2)}
.type input[type=color]{width:30px;height:30px;flex:none;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;-webkit-appearance:none;appearance:none}
.type input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.type input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.type .nm{flex:1;font-weight:600}
.type .wds{width:100%;font-size:14px}
.type .lab{display:block;margin:10px 0 5px;font-size:12px;font-weight:600;color:var(--ink-3)}
.type .sh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-top:10px;font-size:14px;color:var(--ink-2)}
.type .sh .seg button{padding:5px 11px;font-size:13px}
.type .match{margin-top:10px;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.type .match b{font-weight:600;color:var(--ink)}
.type .match.miss{color:#ff9f0a}
.unm{display:flex;flex-wrap:wrap;gap:6px;padding:var(--sp-3) var(--sp-4)}
.unm button{padding:6px 11px;border-radius:999px;background:var(--hair);font-size:13px;font-weight:600}
.unm button::before{content:"+ ";color:var(--accent)}
.mini{width:32px;height:32px;border-radius:50%;background:var(--hair);font-size:15px;color:var(--ink-2);flex:none}
.mini:disabled{opacity:.3}
.act{width:100%;padding:var(--sp-4);text-align:left;font-weight:600;color:var(--accent);border-top:1px solid var(--hair)}
.act:first-child{border-top:0}.act.danger{color:#ff453a}
.hint{margin:var(--sp-2) var(--sp-1) 0;font-size:13px;color:var(--ink-3);line-height:1.4}

/* ---------- Lock + toast ---------- */
#lock{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:var(--sp-5);background:var(--bg)}
#lock form{width:100%;max-width:320px;padding:var(--sp-5);border-radius:var(--r);text-align:center}
#lock h2{font:700 30px var(--display);margin:0 0 4px;letter-spacing:-.02em}
#lock p{margin:0 0 var(--sp-4);color:var(--ink-2);font-size:15px}
#lock input{width:100%;text-align:center;font-size:18px;padding:12px}
#lock button{width:100%;margin-top:var(--sp-3);height:46px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:700}
#lockErr{min-height:20px;margin-top:var(--sp-2);font-size:14px;color:#ff453a}
#toast{position:absolute;left:50%;bottom:calc(104px + var(--safe-b));z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity var(--med),transform var(--med) var(--ease);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}
</style>

<body>
<div id="cap"></div>
<div id="root">
<div id="app">
  <header class="top">
    <button id="titleBtn" aria-label="Jump to a month or year"><h1 id="title"></h1><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <span id="spin"></span>
    <button class="pill icon glass nav" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pill icon glass nav" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </header>

  <section id="overView">
    <div id="weekScroll" class="fadeY"><div id="weekBody"></div></div>
  </section>

  <section id="weekView" hidden>
    <div class="strip glass" id="strip"><div class="days" id="days"></div></div>
    <div id="dayScroll" class="fadeY"><div id="dayBody"></div></div>
  </section>

  <section id="monthView" hidden>
    <div class="mwrap glass"><div class="dow" id="dow"></div><div class="grid" id="grid"></div></div>
    <div id="agenda" class="fadeY"><div id="agendaBody"></div></div>
  </section>

  <nav class="dock" aria-label="Main">
    <div class="tabs glass">
      <button class="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6" rx="2.5"/><rect x="3.5" y="14" width="17" height="6" rx="2.5"/></svg>Week</button>
      <button class="tab" data-tab="month"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>Month</button>
      <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="8.5" cy="17" r="2.5"/></svg>Settings</button>
    </div>
    <button class="glass" id="todayBtn" aria-label="Go to today"><small>Today</small><b id="todayNum"></b></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="detail" aria-hidden="true"></div>
<div class="sheet glass" id="settings" aria-hidden="true"></div>

<div id="lock" hidden>
  <form class="glass" id="lockForm">
    <h2>Glance</h2>
    <p>Enter your passcode to load the calendar on this device.</p>
    <input id="lockIn" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
    <button type="submit">Unlock</button>
    <div id="lockErr"></div>
  </form>
</div>
<div id="toast" class="glass"></div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var DAY=864e5, MIN=6e4;
var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
// Colors Google Calendar uses when an event has its own color
var GCOL={1:'#7986cb',2:'#33b679',3:'#8e24aa',4:'#e67c73',5:'#f6bf26',6:'#f4511e',7:'#039be5',8:'#8a8f98',9:'#3f51b5',10:'#0b8043',11:'#d50000'};
var ACCENTS=['#5b8cff','#0a84ff','#30b0c7','#30d158','#ff9f0a','#ff6482','#bf5af2','#8e8e93'];

/* ---------- iPhone home-screen app: fill the whole screen ----------
   Two WebKit quirks leave a dead band at the bottom of a home-screen app:
   1. After the keyboard has been open once, the page height can stay shrunk. Hiding and re-showing a
      full-height element makes WebKit measure again (heal).
   2. Percentage and fixed heights can stop short of the screen by the height of the status bar. If the
      page is still short after healing, size the root box to the real screen height (fitH).
   "Fill screen bottom" in Settings turns step 2 off on this device if it ever misbehaves. */
function fullH(){
  if(window.navigator.standalone!==true||!/iPhone|iPod/.test(navigator.userAgent))return 0;
  return window.matchMedia('(orientation: portrait)').matches?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
}
function fillOn(){try{return localStorage.getItem('glance.fill')!=='0'}catch(e){return true}}
function fitH(){
  var ex=fullH(), st=document.documentElement.style;
  if(fillOn()&&ex&&ex-window.innerHeight>4)st.setProperty('--app-h',ex+'px'); else st.removeProperty('--app-h');
}
var healDead=false;
function heal(){
  var ex=fullH(), before=window.innerHeight;
  if(healDead||!ex||ex-before<=4)return;
  var a=document.activeElement; if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return; // keyboard is up
  var root=$('root'), ids=['weekScroll','dayScroll','agenda','settings'], tops=ids.map(function(id){return $(id).scrollTop});
  root.style.display='none'; void root.offsetHeight; root.style.display='';
  ids.forEach(function(id,i){$(id).scrollTop=tops[i]});
  setTimeout(function(){if(window.innerHeight-before<=4)healDead=true},200); // didn't help: stop trying this session
}
function settle(){heal();setTimeout(fitH,80)}
fitH();
window.addEventListener('resize',fitH);
window.addEventListener('orientationchange',function(){setTimeout(settle,250)});
window.addEventListener('pageshow',function(){setTimeout(settle,120)});
document.addEventListener('focusout',function(){setTimeout(settle,180)});

/* ---------- Settings ---------- */
var DEF={v:2,mode:'auto',accent:'#5b8cff',glass:60,radius:22,weekStart:0,h24:false,winStart:7,winEnd:23,updatedAt:0,
  // show: 'card' (normal event), 'note' (small marker on the day, not counted as an event), 'hide'
  types:[
    {id:'t0',name:'Payday',color:'#ffd60a',words:['Paycheck','Payday'],show:'note'},
    {id:'t1',name:'INC work',color:'#0a84ff',words:['Working','INC']},
    {id:'t2',name:'Home Depot',color:'#ff9f0a',words:['Home Depot','HD']},
    {id:'t3',name:'Workout',color:'#30d158',words:['Gym','Workout','Bike','Planet Fitness']},
    {id:'t4',name:'Pickleball',color:'#bf5af2',words:['Pickleball']}
  ]};
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function adopt(saved){var x=Object.assign({},DEF,saved||{});if(saved&&!saved.v)x.v=1;return x}
var S=adopt(ls('glance.settings'));
// One-time upgrade of settings saved by builds 1-4: add the Payday day note, and make bike rides count as Workout
function migrate(){
  if((S.v||1)>=2)return false;
  var has=function(t,w){return (t.words||[]).some(function(x){return String(x).toLowerCase()===w})};
  if(!S.types.some(function(t){return t.show==='note'||has(t,'paycheck')}))
    S.types.unshift({id:'t0',name:'Payday',color:'#ffd60a',words:['Paycheck','Payday'],show:'note'});
  var claimed=S.types.some(function(t){return has(t,'bike')});
  S.types.forEach(function(t){if(!claimed&&/workout/i.test(t.name)){t.words=(t.words||[]).concat('Bike');claimed=true}});
  S.v=2; S.updatedAt=Date.now(); ls('glance.settings',S); return true;
}
migrate();
var synced=null; // true = Supabase on, false = this device only
var mq=window.matchMedia('(prefers-color-scheme: dark)');

function applySettings(){
  var dark=S.mode==='dark'||(S.mode==='auto'&&mq.matches);
  var r=document.documentElement, st=r.style;
  r.dataset.mode=dark?'dark':'light';
  st.setProperty('--accent',S.accent);
  st.setProperty('--r',S.radius+'px');
  st.setProperty('--blur',(S.glass*.26).toFixed(1)+'px');
  st.setProperty('--glass-a',((dark?.86:.9)-S.glass*.0042).toFixed(3));
  var m=document.querySelector('meta[name=theme-color]'); if(m)m.content=dark?'#0e1220':'#eef1f8';
}
mq.addEventListener('change',function(){applySettings()});

var saveT=null;
function saveSettings(){
  S.updatedAt=Date.now(); ls('glance.settings',S); marksV++;
  clearTimeout(saveT); saveT=setTimeout(pushSettings,900);
}
function pushSettings(){ if(!KEY)return; api('/api/settings',{method:'PUT',body:JSON.stringify(S)}).then(function(j){synced=!!j.synced}).catch(function(){}) }
function pullSettings(){
  return api('/api/settings').then(function(j){
    synced=!!j.synced;
    if(j.settings&&(j.settings.updatedAt||0)>(S.updatedAt||0)){
      S=adopt(j.settings); ls('glance.settings',S); if(migrate())pushSettings(); marksV++; applySettings(); render();
    }else if(j.synced&&(S.updatedAt||0)>((j.settings&&j.settings.updatedAt)||0)){ pushSettings(); }
  }).catch(function(){});
}

/* ---------- Dates ---------- */
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function key(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function mkey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function weekStart(d){var x=sod(d);return addD(x,-((x.getDay()-S.weekStart+7)%7))}
function localDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime()}
function fT(ms,bare){
  var d=new Date(ms),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);
  if(S.h24)return ('0'+h).slice(-2)+':'+m;
  var ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+m+(bare?'':' '+ap);
}
function fRange(a,b){
  var sameAp=S.h24||((new Date(a).getHours()<12)===(new Date(b).getHours()<12));
  return fT(a,sameAp&&!S.h24)+' – '+fT(b);
}
function fS(ms,ap){ // compact time for the week screen: "5p", "8:30a"
  if(S.h24)return fT(ms);
  var d=new Date(ms),h=d.getHours(),m=d.getMinutes();
  return (h%12||12)+(m?':'+('0'+m).slice(-2):'')+(ap?(h<12?'a':'p'):'');
}
function fSRange(a,b){var sameAp=S.h24||((new Date(a).getHours()<12)===(new Date(b).getHours()<12));return fS(a,!sameAp)+' – '+fS(b,true)}
function fDur(ms){var m=Math.round(ms/MIN),h=Math.floor(m/60);m%=60;return h?(h+'h'+(m?' '+m+'m':'')):(m+'m')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- Events ---------- */
var EV=[], loaded={}, marksV=0, marksAt=-1, marks={}, lastFetch=0, notice='';
function norm(e){
  e.s=e.allDay?localDate(e.start):Date.parse(e.start);
  e.e=e.allDay?localDate(e.end):Date.parse(e.end);
  if(!(e.e>=e.s))e.e=e.s;
  return e;
}
(function(){var c=ls('glance.events'); if(c&&c.events){EV=c.events.map(norm); lastFetch=c.at||0}})();

function typeOf(e){
  var t=(e.title||'').toLowerCase();
  for(var i=0;i<S.types.length;i++){
    var ty=S.types[i];
    for(var j=0;j<(ty.words||[]).length;j++){
      var w=String(ty.words[j]).trim().toLowerCase(); if(!w)continue;
      if(w.length<=3){ // short words like "HD" must stand alone
        if(new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(t))return ty;
      }else if(t.indexOf(w)>-1)return ty;
    }
  }
  return null;
}
function colorOf(e){var t=typeOf(e);return t?t.color:(GCOL[e.colorId]||S.accent)}

function dayEvents(d0){
  var a=d0.getTime(), b=addD(d0,1).getTime(), timed=[], all=[], notes=[];
  for(var i=0;i<EV.length;i++){
    var e=EV[i], hit=e.allDay?(e.s<b&&e.e>a):(e.s<b&&(e.e>a||(e.s===e.e&&e.s>=a)));
    if(!hit)continue;
    var t=typeOf(e), show=t&&t.show;
    if(show==='hide')continue;
    if(show==='note'){notes.push(e);continue}
    if(e.allDay||(e.s<=a&&e.e>=b))all.push(e); else timed.push(e);
  }
  timed.sort(function(x,y){return x.s-y.s||x.e-y.e});
  return {timed:timed,all:all,notes:notes,a:a,b:b};
}
var noteMarks={};
function buildMarks(){
  if(marksAt===marksV)return; marksAt=marksV; marks={}; noteMarks={};
  var sorted=EV.slice().sort(function(x,y){return x.s-y.s});
  sorted.forEach(function(e){
    var t=typeOf(e), show=t&&t.show; if(show==='hide')return;
    var c=colorOf(e), d=sod(new Date(e.s)), end=Math.max(e.e-1,e.s), n=0;
    while(d.getTime()<=end&&n<60){
      var k=key(d);
      if(show==='note')noteMarks[k]=c;
      else{var m=marks[k]||(marks[k]=[]); if(m.indexOf(c)<0&&m.length<4)m.push(c)}
      d=addD(d,1); n++;
    }
  });
}
function marksHtml(d){var m=marks[key(d)]||[];return '<span class="marks">'+m.map(function(c){return '<i style="--c:'+c+'"></i>'}).join('')+'</span>'}

/* ---------- Server ---------- */
var KEY=(function(){try{return localStorage.getItem('glance.key')||''}catch(e){return ''}})();
function api(path,opt){
  opt=opt||{}; opt.headers={'x-glance-key':KEY,'Content-Type':'application/json'};
  return fetch(path,opt).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401){lock('Wrong passcode. Try again.');throw new Error('locked')}
      if(!r.ok){var e=new Error(j.message||('Server error '+r.status));e.server=true;throw e}
      return j;
    });
  });
}
function fetchRange(from,to){ // [from,to) month-aligned dates
  return api('/api/events?from='+encodeURIComponent(from.toISOString())+'&to='+encodeURIComponent(to.toISOString())).then(function(j){
    var a=from.getTime(), b=to.getTime();
    EV=EV.filter(function(e){return !(e.s<b&&e.e>=a)}).concat((j.events||[]).map(norm));
    for(var d=new Date(from);d<to;d=new Date(d.getFullYear(),d.getMonth()+1,1))loaded[mkey(d)]=1;
    marksV++; notice='';
  });
}
var busy=false;
function refresh(quiet){
  if(!KEY||busy)return Promise.resolve();
  busy=true; $('spin').classList.add('on');
  var n=new Date(), from=new Date(n.getFullYear(),n.getMonth()-1,1), to=new Date(n.getFullYear(),n.getMonth()+2,1);
  loaded={};
  var jobs=[fetchRange(from,to)];
  var vm=new Date(sel.getFullYear(),sel.getMonth(),1);
  if(vm<from||vm>=to)jobs.push(fetchRange(vm,new Date(vm.getFullYear(),vm.getMonth()+1,1)));
  return Promise.all(jobs).then(function(){
    lastFetch=Date.now();
    ls('glance.events',{at:lastFetch,events:EV.map(function(e){return{id:e.id,title:e.title,start:e.start,end:e.end,allDay:e.allDay,location:e.location,notes:e.notes,colorId:e.colorId,calendar:e.calendar}})});
    render(); if(!quiet)toast('Updated');
  }).catch(function(e){
    if(e.message==='locked')return;
    if(e.server){notice=e.message;render()} else if(!quiet)toast('Offline. Showing the last saved copy');
  }).then(function(){busy=false;$('spin').classList.remove('on')});
}
function ensureMonth(d){
  var m=new Date(d.getFullYear(),d.getMonth(),1);
  if(loaded[mkey(m)]||!KEY||!lastFetch)return;
  loaded[mkey(m)]=1; $('spin').classList.add('on');
  fetchRange(m,new Date(m.getFullYear(),m.getMonth()+1,1)).then(render).catch(function(){delete loaded[mkey(m)]}).then(function(){if(!busy)$('spin').classList.remove('on')});
}

/* ---------- Render ---------- */
var today=sod(new Date()), sel=today, view='week', wk=null, lastSel=null, lastView=null; // view: week | day | month

function render(dir){
  today=sod(new Date()); buildMarks();
  $('overView').hidden=view!=='week'; $('weekView').hidden=view!=='day'; $('monthView').hidden=view!=='month';
  [].forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('on',t.dataset.tab===(view==='month'?'month':'week'))});
  var ws=weekStart(sel), we=addD(ws,6), atNow;
  if(view==='week'){
    $('title').innerHTML=MO[ws.getMonth()].slice(0,3)+' '+ws.getDate()+' – '+(we.getMonth()!==ws.getMonth()?MO[we.getMonth()].slice(0,3)+' ':'')+we.getDate()+'<small>'+we.getFullYear()+'</small>';
    atNow=same(ws,weekStart(today));
  }else{
    $('title').innerHTML=MO[sel.getMonth()]+'<small>'+sel.getFullYear()+'</small>';
    atNow=same(sel,today);
  }

  if(view==='week')renderWeek(dir); else if(view==='day'){renderStrip(dir);renderDay(dir)} else renderMonth(dir);

}
function anim(el,cls){el.classList.remove('slide-l','slide-r','fade');void el.offsetWidth;if(cls)el.classList.add(cls)}

function renderStrip(dir){
  var ws=weekStart(sel), days=$('days'), changed=!wk||wk.getTime()!==ws.getTime();
  var idx=Math.round((sel-ws)/DAY);
  if(changed||days.dataset.v!==String(marksV)+S.weekStart){
    var h='<div class="ind" id="ind"></div>';
    for(var i=0;i<7;i++){
      var d=addD(ws,i);
      h+='<button class="day'+(same(d,today)?' today':'')+'" data-i="'+i+'" aria-label="'+WD[d.getDay()]+' '+d.getDate()+'"><span class="wd">'+WD[d.getDay()].slice(0,3)+'</span><span class="num">'+d.getDate()+'</span>'+marksHtml(d)+'</button>';
    }

  [].forEach.call(days.querySelectorAll('.day'),function(b,i){b.classList.toggle('sel',i===idx)});

function plan(day){ // events in time order, with free gaps inside the day window
  var E=dayEvents(day), now=Date.now(), isToday=same(day,today);
  var w0=new Date(day.getFullYear(),day.getMonth(),day.getDate(),S.winStart).getTime();
  var w1=new Date(day.getFullYear(),day.getMonth(),day.getDate(),S.winEnd).getTime();
  var items=[], cur=w0, freeMs=0;
  function gap(a,b){
    if(b-a<30*MIN)return;
    var past=E.b<=now||(isToday&&b<=now), live=isToday&&a<=now&&b>now;
    if(live)a=Math.max(a,Math.floor(now/(5*MIN))*5*MIN);
    if(!past)freeMs+=b-a;
    items.push({free:1,a:a,b:b,past:past,live:live});
  }
  E.timed.forEach(function(e){
    var a=Math.max(e.s,w0), b=Math.min(e.e,w1);
    if(a>cur&&a<=w1)gap(cur,a);
    items.push({e:e});
    if(b>cur)cur=b;
  });
  if(E.timed.length)gap(Math.max(cur,w0),w1);
  var nextId=null;
  if(isToday)for(var i=0;i<E.timed.length;i++)if(E.timed[i].e>now){nextId=E.timed[i].id;break}
  return {E:E,items:items,freeMs:freeMs,nextId:nextId,isToday:isToday,past:E.b<=now};
}

function evCards(P){ // compact tinted cards for one day (week rows + month agenda)

    h+='<span class="chips">';
    E.all.forEach(function(e){h+='<button class="ev ad" data-id="'+esc(e.id)+'" style="--c:'+colorOf(e)+'"><span class="t">'+esc(e.title)+'</span></button>'});
    E.notes.forEach(function(e){h+='<button class="ev ad note" data-id="'+esc(e.id)+'" style="--c:'+colorOf(e)+'"><span class="t">'+esc(e.title)+'</span></button>'});
    h+='</span>';
  }
  P.items.forEach(function(it){
    if(it.free){
      var hrs=(it.b-it.a)/36e5;
      h+='<span class="wgap'+(it.past?' past':'')+(it.live?' now':'')+'" style="--h:'+Math.round(Math.min(84,18+hrs*9))+'px">'+(it.live?'Free now, until '+fS(it.b,true):'Free '+fSRange(it.a,it.b))+'</span>';
      return;
    }
    var e=it.e;
    var when=e.s<E.a?'until '+fS(e.e,true):(e.e>E.b?'from '+fS(e.s,true):(e.s===e.e?fS(e.s,true):fSRange(e.s,e.e)));
    h+='<button class="ev'+(P.isToday&&e.e<=now?' past':'')+(e.id===P.nextId?' next':'')+'" data-id="'+esc(e.id)+'" style="--c:'+colorOf(e)+'"><span class="t">'+esc(e.title)+'</span><span class="w">'+when+'</span></button>';
  });
  if(!E.timed.length)h+='<span class="none">'+(E.all.length?'Nothing timed':(lastFetch||notice?'Free all day':'Loading…'))+'</span>';
  return h;
}
function freeText(P,rich){return P.past?'':(P.E.timed.length?(P.freeMs?fDur(P.freeMs)+(rich?' <em>free</em>':' free'):'Full'):'')}

function renderWeek(dir){

function renderDay(dir){
  var P=plan(sel), E=P.E, items=P.items, freeMs=P.freeMs, nextId=P.nextId, isToday=P.isToday, now=Date.now(), h='';
  var n=E.timed.length;

function renderMonth(dir){
  var h='', first=new Date(sel.getFullYear(),sel.getMonth(),1), start=weekStart(first), i;
  for(i=0;i<7;i++){var wd=(S.weekStart+i)%7;h+='<span class="'+(wd===0||wd===6?'we':'')+'">'+WD[wd].slice(0,3)+'</span>'}

function swipe(el,onX,onPull){
  var x0,y0,t0,top;
  el.addEventListener('touchstart',function(ev){var t=ev.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();top=el.scrollTop<=0},{passive:true});
  el.addEventListener('touchend',function(ev){

  },{passive:true});
}

function plain(s){s=String(s||'');if(!/[<&]/.test(s))return s;try{return new DOMParser().parseFromString(s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li)>/gi,'\n'),'text/html').body.textContent.trim()}catch(e){return s}}

    var m=hits[t.id]||[], show=t.show||'card';
    return '<div class="type" data-i="'+i+'"><div class="a"><input type="color" value="'+esc(t.color)+'" data-f="color" aria-label="Color"><input type="text" class="nm" value="'+esc(t.name)+'" data-f="name" placeholder="Name" aria-label="Name">'+
      '<button class="mini" data-mv="-1" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button><button class="mini" data-mv="1" aria-label="Move down"'+(i===S.types.length-1?' disabled':'')+'>↓</button><button class="mini" data-del="1" aria-label="Delete">✕</button></div>'+
      '<label class="lab">Use for titles that contain (commas between words)</label>'+
      '<input type="text" class="wds" value="'+esc((t.words||[]).join(', '))+'" data-f="words" placeholder="Gym, Bike, Run" aria-label="Title words" autocapitalize="off" autocorrect="off">'+
      '<div class="sh"><span>Show as</span>'+seg('show',[['card','Event'],['note','Day note'],['hide','Hidden']],show)+'</div>'+
      '<div class="match'+(m.length?'':' miss')+'">'+(m.length?'Catching now: <b>'+m.slice(0,4).map(esc).join(', ')+'</b>'+(m.length>4?' and '+(m.length-4)+' more':''):'Not catching any events right now')+'</div></div>';
  }).join('')+'<button class="act" id="addType">Add a color</button></div>'+
    '<p class="hint">A day note is a small marker on the day instead of an event card. It doesn\'t count toward events or free time.</p>'+
    (loose.length?'<h4 style="margin:18px 4px 8px;font-size:14px;font-weight:600;color:var(--ink-2)">Titles with no color yet</h4><div class="box"><div class="unm">'+loose.slice(0,12).map(function(x){return '<button data-unm="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div></div>'+
      '<p class="hint">These show the color set on the event in Google Calendar. If the event has none, they use your accent color, because the calendar\'s own color doesn\'t come through. Tap a title to give it a color here.</p>':'')+'</div>';
  h+='<div class="sec"><h4>Calendar</h4><div class="box">'+
    '<div class="line"><span>Week starts</span>'+seg('weekStart',[[0,'Sunday'],[1,'Monday']],S.weekStart)+'</div>'+
    '<div class="line"><span>Time</span>'+seg('h24',[['false','12 hour'],['true','24 hour']],S.h24)+'</div>'+
    '<div class="line"><span>Free time</span><span class="win"><select id="w0" aria-label="From">'+hourOpts(S.winStart,0,22)+'</select> to <select id="w1" aria-label="To">'+hourOpts(S.winEnd,1,24)+'</select></span></div>'+
    '</div></div>';
  h+='<div class="sec"><h4>This device</h4><div class="box">'+(fullH()?'<div class="line"><span>Fill screen bottom</span>'+seg('fill',[['1','On'],['0','Off']],fillOn()?'1':'0')+'</div>':'')+'<button class="act" id="refNow">Refresh now</button><button class="act danger" id="lockNow">Lock this device</button></div>'+
    '<p class="hint">'+(lastFetch?'Calendar updated '+new Date(lastFetch).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. ':'')+
    (synced===true?'Settings sync across your devices.':synced===false?'Settings are saved on this device only (Supabase isn\'t connected).':'')+'</p></div>';
  $('settings').innerHTML=h;
}
function changed(rerender){applySettings();saveSettings();render();if(rerender)renderSettings()}
$('settings').addEventListener('click',function(ev){
  var t=ev.target, b;
  if(t.id==='setDone')return closeSheets();
  if(t.id==='refNow'){closeSheets();return refresh()}
  if(t.id==='lockNow'){closeSheets();KEY='';lsDel('glance.key');lsDel('glance.events');EV=[];lastFetch=0;marksV++;return lock('')}
  if(t.id==='addType'){S.types.push({id:'t'+Date.now(),name:'New color',color:'#64d2ff',words:[]});return changed(true)}
  if(t.dataset.unm){S.types.push({id:'t'+Date.now(),name:t.dataset.unm,color:'#64d2ff',words:[t.dataset.unm]});return changed(true)}
  if(t.dataset.v!==undefined&&t.closest('[data-seg="show"]')){S.types[+t.closest('.type').dataset.i].show=t.dataset.v;return changed(true)}
  if((b=t.closest('[data-seg]'))&&t.dataset.v!==undefined){
    var k=b.dataset.seg,v=t.dataset.v;
    if(k==='fill'){try{localStorage.setItem('glance.fill',v)}catch(e){} fitH(); return renderSettings()}
    S[k]=k==='mode'?v:k==='h24'?v==='true':+v; wk=null; return changed(true);
  }
  if(t.dataset.accent){S.accent=t.dataset.accent;return changed(true)}
  var row=t.closest('.type'); if(!row)return; var i=+row.dataset.i;
  if(t.dataset.mv){var j=i+(+t.dataset.mv);if(j<0||j>=S.types.length)return;var x=S.types[i];S.types[i]=S.types[j];S.types[j]=x;return changed(true)}
  if(t.dataset.del){if(confirm('Delete "'+S.types[i].name+'"?')){S.types.splice(i,1);changed(true)}}
});
$('settings').addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='glassR'){S.glass=+t.value;applySettings()}
  else if(t.id==='radR'){S.radius=+t.value;applySettings()}
  else if(t.id==='accentPick'){S.accent=t.value;applySettings()}
});
$('settings').addEventListener('change',function(ev){
  var t=ev.target, row=t.closest('.type');
  if(row){var ty=S.types[+row.dataset.i],f=t.dataset.f;
    if(f==='words')ty.words=t.value.split(',').map(function(s){return s.trim()}).filter(Boolean); else ty[f]=t.value;
    return changed(false)}
  if(t.id==='w0'||t.id==='w1'){var a=+$('w0').value,b=+$('w1').value;if(b<=a){b=Math.min(24,a+1);}S.winStart=a;S.winEnd=b;return changed(true)}
  if(t.id==='accentPick')return changed(true);
  changed(false);
});

/* ---------- Lock ---------- */
function lock(msg){$('lock').hidden=false;$('lockErr').textContent=msg||'';$('lockIn').value='';setTimeout(function(){$('lockIn').focus()},50)}
$('lockForm').addEventListener('submit',function(ev){
  ev.preventDefault(); var v=$('lockIn').value.trim(); if(!v)return;
  KEY=v; try{localStorage.setItem('glance.key',v)}catch(e){}
  $('lock').hidden=true; notice=''; start();
});

var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1800)}

/* ---------- Go ---------- */
function start(){ render(); refresh(true); pullSettings(); }
applySettings();
if(KEY)start(); else{render();lock('')}
setInterval(function(){if(!document.hidden)refresh(true)},5*60*1000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  settle();
  if(!same(today,sod(new Date()))){sel=sod(new Date());wk=null}
  if(Date.now()-lastFetch>60*1000){refresh(true);pullSettings()} else render();
});
setInterval(function(){if(!document.hidden&&!document.querySelector('.sheet.on'))render()},60*1000);
})();
</script>
</body>
</html>
